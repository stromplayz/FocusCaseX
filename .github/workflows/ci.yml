name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild + validate the registry
        run: |
          node scripts/build-registry.mjs
          node -e "JSON.parse(require('fs').readFileSync('api/core.json','utf8')); JSON.parse(require('fs').readFileSync('catalog.json','utf8')); console.log('JSON OK')"
      - name: Ensure registry is committed fresh
        run: |
          # ignore the generatedAt timestamp line — it re-stamps on every rebuild
          git diff --exit-code -I'"generatedAt"' -- api/registry.json \
            || (echo "::error::api/registry.json is stale — run scripts/build-registry.mjs and commit"; exit 1)
